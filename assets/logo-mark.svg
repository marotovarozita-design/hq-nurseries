<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img" aria-label="The Wendy House mark">
  <title>The Wendy House mark</title>
  <defs>
    <style>
      <![CDATA[
        .bg      { fill: #FAF4E1; }
        .brown   { fill: #6B4423; }
        .brown-d { fill: #4A2E17; }
        .brown-l { fill: #8A5A30; }
        .yellow  { fill: #F1B434; }
        .yellow-l{ fill: #F6CA68; }
        .green   { fill: #7BA955; }
        .green-d { fill: #5C8A3E; }
        .blue    { fill: #B9D9E8; }
        .cream   { fill: #FFFBED; }
      ]]>
    </style>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect class="bg" width="440" height="400" rx="32" ry="32"/>

  <g transform="translate(20 40)" filter="url(#soft)">
    <!-- Sky clouds -->
    <g opacity="0.9">
      <ellipse class="blue" cx="80"  cy="60" rx="34" ry="14"/>
      <ellipse class="blue" cx="110" cy="54" rx="22" ry="11"/>
      <ellipse class="blue" cx="320" cy="56" rx="30" ry="12"/>
      <ellipse class="blue" cx="300" cy="62" rx="18" ry="9"/>
    </g>
    <!-- Grass hill -->
    <path class="green" d="M -20 270 Q 200 230 420 270 L 420 320 L -20 320 Z"/>
    <path class="green-d" d="M -20 290 Q 200 258 420 290 L 420 320 L -20 320 Z" opacity="0.55"/>
    <!-- Little leaves -->
    <g transform="translate(60 245)">
      <path class="green-d" d="M 0 20 C -2 8 10 -2 18 4 C 22 10 18 20 12 22 Z"/>
      <path class="green-d" d="M 18 22 C 24 10 38 12 40 22 C 36 30 24 30 20 26 Z"/>
      <rect class="brown" x="16" y="18" width="2" height="14" rx="1"/>
    </g>
    <g transform="translate(346 248)">
      <path class="green-d" d="M 0 18 C -2 6 12 -2 20 4 C 22 10 16 18 10 20 Z"/>
      <rect class="brown" x="10" y="14" width="2" height="12" rx="1"/>
    </g>
    <!-- House -->
    <g transform="translate(160 80)">
      <rect class="brown" x="110" y="-6" width="14" height="34" rx="2"/>
      <rect class="yellow" x="124" y="-6" width="26" height="16" rx="1"/>
      <path class="brown-d" d="M -6 60 L 70 -8 L 146 60 Z"/>
      <path class="brown-l" d="M 70 -8 L 146 60 L 140 60 L 70 2 Z" opacity="0.35"/>
      <rect class="cream" x="8" y="58" width="124" height="120" rx="6"/>
      <rect x="8" y="58" width="124" height="120" rx="6" fill="none" stroke="#8A5A30" stroke-width="3"/>
      <circle class="yellow" cx="42" cy="96" r="16"/>
      <circle cx="42" cy="96" r="16" fill="none" stroke="#6B4423" stroke-width="2.5"/>
      <line x1="42" y1="80" x2="42" y2="112" stroke="#6B4423" stroke-width="2"/>
      <line x1="26" y1="96" x2="58" y2="96" stroke="#6B4423" stroke-width="2"/>
      <rect class="brown" x="76" y="110" width="40" height="68" rx="4"/>
      <line x1="90"  y1="116" x2="90"  y2="174" stroke="#4A2E17" stroke-width="1.2" opacity="0.55"/>
      <line x1="102" y1="116" x2="102" y2="174" stroke="#4A2E17" stroke-width="1.2" opacity="0.55"/>
      <circle class="yellow" cx="109" cy="146" r="2.4"/>
      <path class="brown" d="M 76 112 Q 96 100 116 112 L 116 118 L 76 118 Z"/>
    </g>
    <!-- Bee -->
    <g transform="translate(68 170)">
      <ellipse class="blue" cx="6"  cy="-8" rx="14" ry="10" opacity="0.85"/>
      <ellipse class="blue" cx="22" cy="-10" rx="12" ry="8" opacity="0.85"/>
      <ellipse class="yellow" cx="16" cy="6" rx="22" ry="16"/>
      <path class="brown-d" d="M 4 -3 Q 6 10 0 16 L 6 18 Q 14 10 10 -2 Z"/>
      <path class="brown-d" d="M 24 -3 Q 30 10 24 18 L 18 16 Q 26 10 20 -2 Z"/>
      <circle class="brown-d" cx="-6" cy="4" r="8"/>
      <circle class="cream" cx="-8" cy="2" r="1.8"/>
      <path d="M -10 -2 Q -12 -10 -8 -12" stroke="#4A2E17" stroke-width="1.5" fill="none"/>
      <circle class="brown-d" cx="-8" cy="-13" r="1.5"/>
      <path d="M -8 6 Q -6 8 -4 6" stroke="#2E2418" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path class="brown-d" d="M 36 6 L 44 2 L 44 10 Z"/>
    </g>
    <!-- Owl -->
    <g transform="translate(320 200)">
      <path class="brown-d" d="M 14 60 L 8 72 L 22 72 Z"/>
      <ellipse class="brown" cx="20" cy="44" rx="28" ry="32"/>
      <ellipse class="brown-l" cx="20" cy="52" rx="16" ry="18" opacity="0.7"/>
      <circle class="brown" cx="20" cy="18" r="22"/>
      <path class="brown-d" d="M 4 6 L 2 -6 L 12 4 Z"/>
      <path class="brown-d" d="M 36 6 L 38 -6 L 28 4 Z"/>
      <circle class="cream" cx="12" cy="20" r="8"/>
      <circle class="cream" cx="28" cy="20" r="8"/>
      <circle class="brown-d" cx="13" cy="20" r="3"/>
      <circle class="brown-d" cx="27" cy="20" r="3"/>
      <circle class="cream" cx="14" cy="19" r="1"/>
      <circle class="cream" cx="28" cy="19" r="1"/>
      <path class="yellow" d="M 20 24 L 16 30 L 24 30 Z"/>
      <path class="brown-d" d="M -4 40 Q -8 58 8 66 Q 6 50 2 40 Z"/>
      <path class="brown-d" d="M 44 40 Q 48 58 32 66 Q 34 50 38 40 Z"/>
      <g stroke="#F1B434" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M 12 74 L 10 82 M 14 74 L 14 82 M 18 74 L 20 82"/>
        <path d="M 24 74 L 24 82 M 28 74 L 30 82"/>
      </g>
    </g>
  </g>
</svg>
